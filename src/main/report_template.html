<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{REPORT_TITLE}}</title>
  <style>
    :root {
      --ink: #1d2a3a;
      --accent: #007f5f;
      --accent-soft: #e7f6f1;
      --surface: #ffffff;
      --surface-alt: #f5f7fa;
      --line: #d9e1ea;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at top right, #cdeee4 0%, #eef3f8 40%, #f7f9fb 100%);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(29, 42, 58, 0.08);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--accent), #00916e);
      color: white;
      padding: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.9rem;
      letter-spacing: 0.3px;
    }

    .meta {
      margin-top: 8px;
      font-size: 0.95rem;
      opacity: 0.95;
    }

    .section {
      padding: 24px;
    }

    .section h2 {
      margin-top: 0;
      font-size: 1.3rem;
      color: var(--ink);
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
    }

    .summary-table thead {
      background: var(--accent-soft);
    }

    .summary-table th,
    .summary-table td {
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      font-size: 0.95rem;
    }

    .summary-table tr:last-child td {
      border-bottom: none;
    }

    .missing-note {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d5dce5;
      background: #f7f9fc;
      color: #2f3e4f;
      font-size: 0.92rem;
      line-height: 1.4;
    }

    .missing-note-warning {
      border-color: #f0b6b6;
      background: #fff2f2;
      color: #7a2525;
    }

    .visual-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }

    .visual-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-alt);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .visual-card h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .visual-card p {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.4;
      color: #425467;
    }

    .visual-image {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: white;
      object-fit: contain;
    }

    .visual-placeholder {
      border: 2px dashed #9fc4b9;
      border-radius: 8px;
      min-height: 180px;
      display: grid;
      place-items: center;
      color: #567267;
      background: #f3fbf8;
      font-size: 0.95rem;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .header,
      .section {
        padding: 16px;
      }

      .header h1 {
        font-size: 1.5rem;
      }

      .summary-table th,
      .summary-table td {
        font-size: 0.88rem;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>{{REPORT_TITLE}}</h1>
      <div class="meta">Generated: {{REPORT_DATE}}</div>
    </header>

    <section class="section">
      <h2>Summary Table</h2>
      {{SUMMARY_TABLE}}
      {{MISSING_PERIOD_NOTE}}
    </section>

    <section class="section">
      <h2>Visualisations</h2>
      <div class="visual-grid">
        {{VISUALISATIONS}}
      </div>
    </section>
  </main>
</body>
</html>
